[package]
name = "ground_llm"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "ground_llm"
crate-type = ["cdylib"]

[dependencies]
pollster = "1"
pyo3 = { version = "0.27.0", features = ["extension-module"] }
rand = "0.10.1"
rayon = "1.10"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "wgsl"] }
